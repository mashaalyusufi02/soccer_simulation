<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soccer Simulation</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="dashboard-container">

        <!-- Top Controls Row -->
        <div class="row buttons-row">
            <button class="btn setup-btn">setup</button>
            <button class="btn go-btn">go <span>&#8634;</span></button>
            <button class="btn replay-btn">reset</button>
        </div>

        <!-- Settings Section -->
        <div class="settings-grid">

            <!-- Betrayal threshold sliders -->
            <div class="settings-column">
                <h3 class="section-title">Betrayal threshold</h3>

                <div class="slider-container">
                    <span class="slider-label">Red Betrayal threshold</span>
                    <input type="range" min="0" max="1" step="0.01" value="0.25" id="red_betrayal_threshold">
                    <span class="slider-value">0.25</span>
                </div>

                <div class="slider-container">
                    <span class="slider-label">Blue Betrayal threshold</span>
                    <input type="range" min="0" max="1" step="0.01" value="0.25" id="blue_betrayal_threshold">
                    <span class="slider-value">0.25</span>
                </div>

                <div class="slider-container">
                    <span class="slider-label">Green Betrayal threshold</span>
                    <input type="range" min="0" max="1" step="0.01" value="0.5" id="green_betrayal_threshold">
                    <span class="slider-value">0.5</span>
                </div>
            </div>

            <!-- Number of players sliders -->
            <div class="settings-column">
                <h3 class="section-title">Number of Players</h3>

                <div class="slider-container">
                    <span class="slider-label">Number Red Players</span>
                    <input type="range" min="3" max="5" step="1" value="3" id="red_players">
                    <span class="slider-value">3</span>
                </div>

                <div class="slider-container">
                    <span class="slider-label">Number Blue Players</span>
                    <input type="range" min="3" max="5" step="1" value="3" id="blue_players">
                    <span class="slider-value">3</span>
                </div>

                <div class="slider-container">
                    <span class="slider-label">Number Green Players</span>
                    <input type="range" min="3" max="5" step="1" value="3" id="green_players">
                    <span class="slider-value">3</span>
                </div>
            </div>

        </div>

        <!-- Status Counters -->
        <div class="row counters-row">
            <div class="counter-box">
                <span class="counter-label">ticks</span>
                <div class="counter-value" id="tick-counter">0</div>
            </div>
            <div class="counter-box">
                <span class="counter-label">red goals</span>
                <div class="counter-value" id="red-score">0</div>
            </div>
            <div class="counter-box">
                <span class="counter-label">blue goals</span>
                <div class="counter-value" id="blue-score">0</div>
            </div>
            <div class="counter-box">
                <span class="counter-label">green goals</span>
                <div class="counter-value" id="green-score">0</div>
            </div>
        </div>

        <!-- Legend + Field -->
        <div id="simulation-container">
            <canvas id="gameCanvas" width="400" height="400"></canvas>
        </div>

        <div class="legend field-legend">
            <div class="legend-item"><span class="color-box red-color"></span> red</div>
            <div class="legend-item"><span class="color-box blue-color"></span> blue</div>
            <div class="legend-item"><span class="color-box green-color"></span> green</div>
        </div>

        <div class="row" id="event-log">
            <span class="muted">Press "setup" then "go" to start the match.</span>
        </div>

        <script src="{{ url_for('static', filename='simulation.js') }}"></script>

    </div>

</body>
</html>
